<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wireframe</title>
    <style>
        ul{
            display: flex;
            gap: 30px;
            border:2px dashed black;
            height:100px
            justfiy-content:center;
            align-items:center;
            

        }

        li{
            list-style:none;
        }

        #home{
            height:500px;
            border:2px dotted black;
            text-align:center;


        }

        #about{
            height:500px;
            border:2px dotted black;
            text-align:center;

        }

        #service{
            height:500px;
            border:2px dotted black;
            text-align:center

        }


         
         #help{
            height:500px;
            border:2px dotted black;
            text-align:center
         }

         footer{
            height:500px;
            border:2px dotted black;
            text-align:center
         }

         
    

    </style>
</head>
<body>
    <header>
        <navbar>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>Help</li>
            </ul>
        </navbar>
    </header>
    <main>
        <section id="home">this is home section>
            <div class="mountain-image">
                <img src="https://media.istockphoto.com/id/475070626/photo/mountains-pangong-tso-leh-ladakh-jammu-and-kashmir-india.jpg?s=1024x1024&w=is&k=20&c=xg_Ay-D2IRYvL45TAmBSpmJUQF9Dy1w4JnOmEUpMwOg="
             </div>

        </section>
        <section id="about">this is about section</section>
        <section id="service">this is service section</section>
        <section id="help">this is help section</section>

    </main>
    <footer>this is footer</footer>
</body>
</html>
