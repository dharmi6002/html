<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>media</title>
  </head>
  <body>
    <video
      src="./asset/video.mp4"
      height="500"
      width="500"
      controls
      loop
    ></video>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/M_rH3Z_R6-U?si=mD2eQS3RUaSlvZ9k"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
