<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>
<body>

    <table border="1px">
        <thead>
            <tr>
                <th>vegetables</th>
                <th colspan="2">fruits</th>
                <th></th>
            </tr>
            
            <tr>
            <td>yellow peppper</td>
            <td rowspan="2">banana</td>
            <td rowspan="2">orange</td>
            <td rowspan="3">yellow</td>

            </tr>

            <tr>
                <td>yellow zucchini</td>
                
            </tr>

            <tr>
                <td>pumpkin;corn</td>
                <td colspan="2">pineapple</td>
                
            </tr>

            <tr>
                <td>red pepper</td>
                <td rowspan="2">strawberry</td>
                <td rowspan="2">watermelon</td>
                <td rowspan="3">red</td>
            </tr>

            <tr>
                <td>beet;tomato</td>
                
            </tr>

            <tr>
                <td>redishes</td>
                <td colspan="2">cherries</td>
                
            </tr>

        </thead>
    </table>
    
</body>
</html>
